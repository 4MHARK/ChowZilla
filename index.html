<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('chowzilla-theme')
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#111827' : '#FFFFFF')
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>ChowZilla — Big cravings, small wait.</title>
    <meta name="description" content="Your favourite meals, made fresh and delivered fast. Find restaurants near you with ChowZilla." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChowZilla" />
    <meta property="og:title" content="ChowZilla — Big cravings, small wait." />
    <meta property="og:description" content="Your favourite meals, made fresh and delivered fast. Find restaurants near you with ChowZilla." />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:image:alt" content="A fresh, colourful bowl of food ready for delivery" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChowZilla — Big cravings, small wait." />

    <meta name="twitter:image" content="/images/og-image.jpg" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="/images/hero-bowl-1000.jpg" imagesrcset="/images/hero-bowl-600.jpg 600w, /images/hero-bowl-1000.jpg 1000w" imagesizes="(max-width: 640px) 70vw, 390px" fetchpriority="high" />
  </head>

</html>
